<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore my collection</p>
    </header>

    <!-- Filter Buttons -->
    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="travel">Travel</button>
        <button class="filter-btn" data-filter="city">City</button>
    </div>

    <!-- Gallery -->
    <div class="gallery">

        <div class="gallery-item nature">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800"
                 alt="Nature">
        </div>

        <div class="gallery-item travel">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800"
                 alt="Travel">
        </div>

        <div class="gallery-item city">
            <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=800"
                 alt="City">
        </div>

        <div class="gallery-item nature">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800"
                 alt="Forest">
        </div>

        <div class="gallery-item travel">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800"
                 alt="Landscape">
        </div>

        <div class="gallery-item city">
            <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=800"
                 alt="City Street">
        </div>

    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">

        <button id="closeBtn" class="close-btn">&times;</button>

        <button id="prevBtn" class="nav-btn prev-btn">
            &#10094;
        </button>

        <img id="lightboxImage" src="" alt="Large image">

        <button id="nextBtn" class="nav-btn next-btn">
            &#10095;
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
